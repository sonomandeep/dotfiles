# --- Ayu Tmux Configuration ---

##### Base Settings
# Place status bar at the top
set -g status-position top
set -g default-terminal "tmux-256color"

# Enable True Color support for Ghostty and other modern terminals
set -as terminal-overrides ',xterm-256color:Tc,tmux-256color:Tc,ghostty:Tc,screen-256color:Tc'

# Enable mouse support and Vi mode for copy-paste efficiency
set -g mouse on
set -g mode-keys vi
set -s set-clipboard on

# Eliminate escape delay for better Neovim responsiveness
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Lengthen the duration of status messages
set -g display-time 4000

# Improved Vi copy mode bindings
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel


##### Key Bindings
# Remap prefix from 'C-b' to 'C-Space'
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix


##### Window and Pane Indexing
# Start indexing at 1 to match keyboard layout
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on


##### Pane Management
# Split panes using geometric symbols: | for vertical, - for horizontal
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


##### Navigation
# Seamless Vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


##### Resizing
# Resize panes using Ctrl + arrow keys
bind -n C-Left  resize-pane -L 5
bind -n C-Down  resize-pane -D 2
bind -n C-Up    resize-pane -U 5
bind -n C-Right resize-pane -R 5

# Alternative: Alt + Vim direction keys
# bind -r M-h resize-pane -L 5
# bind -r M-j resize-pane -D 2
# bind -r M-k resize-pane -U 5
# bind -r M-l resize-pane -R 5


# ============================================================
# Ayu Theme
# Based on the official ayu-vim palette
# ============================================================

##### Ayu Palette

# ---- DARK (default) ----
set -g @ayu_bg        "#0F1419"
set -g @ayu_panel     "#14191F"
set -g @ayu_fg        "#E6E1CF"
set -g @ayu_fg_idle   "#3E4B59"
set -g @ayu_accent    "#F29718"
set -g @ayu_selection "#253340"
set -g @ayu_guide     "#2D3640"
set -g @ayu_error     "#FF3333"

# ---- LIGHT ----
# Comment the DARK block above and uncomment this block
# to switch to Ayu Light.
#
# set -g @ayu_bg        "#FAFAFA"
# set -g @ayu_panel     "#FFFFFF"
# set -g @ayu_fg        "#5C6773"
# set -g @ayu_fg_idle   "#828C99"
# set -g @ayu_accent    "#FF6A00"
# set -g @ayu_selection "#F0EEE4"
# set -g @ayu_guide     "#D9D8D7"
# set -g @ayu_error     "#FF3333"


##### Ayu Theme Application

# Status bar
set -g status-style "bg=#{@ayu_panel},fg=#{@ayu_fg}"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 60

# Session
set -g status-left "#[bg=#{@ayu_accent},fg=#{@ayu_bg},bold] #S #[bg=#{@ayu_panel},fg=#{@ayu_accent}] "

# Date / Time
set -g status-right "#[fg=#{@ayu_fg_idle}]%d-%b #[fg=#{@ayu_fg}]%H:%M "

# Windows
set -g window-status-format " #I:#W "
set -g window-status-style "fg=#{@ayu_fg_idle}"

set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#{@ayu_selection},fg=#{@ayu_fg},bold"

# Pane borders
set -g pane-border-style "fg=#{@ayu_guide}"
set -g pane-active-border-style "fg=#{@ayu_accent}"

# Messages
set -g message-style "bg=#{@ayu_accent},fg=#{@ayu_bg},bold"
set -g message-command-style "bg=#{@ayu_accent},fg=#{@ayu_bg},bold"

# Copy / selection mode
set -g mode-style "bg=#{@ayu_selection},fg=#{@ayu_fg}"

# Clock
set -g clock-mode-colour "#F29718"

##### Plugins (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-cpu'

# Sessionx plugin configuration
set -g @sessionx-bind 'o'
set -g @sessionx-window-mode 'on'


# Initialize TMUX plugin manager
# Keep this at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'



















